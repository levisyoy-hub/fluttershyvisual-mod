name: Build Fabric Mod
on: 
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Clean all caches and build artifacts
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper ~/.gradle/loom-cache .gradle/ build/
          find ~/.gradle -type d -name "*loom*" -exec rm -rf {} + 2>/dev/null || true
      
      - name: Verify gradle wrapper
        run: ls -la gradle/wrapper/gradle-wrapper.jar
      
      - name: Build Fabric Mod
        run: ./gradlew --version && ./gradlew clean build
      
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fluttershyvisual
          path: build/libs/*.jar
          retention-days: 30
