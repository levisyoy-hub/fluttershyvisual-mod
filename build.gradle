buildscript {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		maven { url = "https://maven.neoforged.net/releases" }
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:1.8.11"
	}
}

apply plugin: "fabric-loom"
apply plugin: "maven-publish"

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	mavenLocal()
	mavenCentral()
	maven { url = "https://api.modrinth.com/maven" }
	maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "fabric_loader_version", project.loader_version
	inputs.property "fabric_api_version", project.fabric_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"fabric_loader_version": project.loader_version,
				"fabric_api_version": project.fabric_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { String fileName -> "${fileName}_${project.archivesBaseName}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
